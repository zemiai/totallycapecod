name: "daily metrics"

# Daily 10:00 UTC: Search Console, GA4 and Stripe numbers into data/metrics.json and the
# ranking trend into data/gsc_history.json (scripts/update_metrics.py).
#
# No paid ads (owner's decision, Nov 8, 2026): the Friday Meta boost and the daily ad
# report were removed. scripts/boost_post.py, ads_report.py and launch_ads.py are unused.
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write      # keyless Google auth (workload identity) for Search Console + GA4

concurrency:
  group: ads-auto
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests google-auth
      - name: Google auth (keyless — GitHub OIDC → tcc-metrics service account)
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/107969132506/locations/global/workloadIdentityPools/github/providers/github-repo
          service_account: tcc-metrics@totally-capecod.iam.gserviceaccount.com
      - name: Business metrics (search console + ga4 + stripe)
        run: python scripts/update_metrics.py
        env:
          STRIPE_REPORTING_KEY: ${{ secrets.STRIPE_REPORTING_KEY }}
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
      - name: Commit report if changed
        run: |
          git config user.name "hermes-bot"
          git config user.email "hermes-bot@users.noreply.github.com"
          git add data/metrics.json data/gsc_history.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[metrics] nightly update $(date -u +%F)"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git pull --rebase --autostash origin main || exit 1
            sleep $((i * 3))
          done
          exit 1
