name: "post to Facebook"

# Two posts a day to the FB Page + Instagram, built from the app's live data by
# the variety engine in scripts/post_facebook.py:
#   11:30 UTC (7:30 AM ET) — morning format (rotates by weekday)
#   21:00 UTC (5:00 PM ET) — "Tonight on Cape" evening post
# The script picks the slot from the clock (ET hour >= 15 → evening); each slot
# is idempotent via data/.fb_state.json. Images are the curated photos already
# in img/social/ — no per-day image generation or commit needed anymore.
#
# Requires repo secrets: FB_PAGE_ID, FB_PAGE_ACCESS_TOKEN, IG_USER_ID.

on:
  schedule:
    - cron: "30 11 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only — print the post, do NOT send (type 1)"
        required: false
        default: ""
      force:
        description: "Post even if already posted this slot today (type 1)"
        required: false
        default: ""
      mode:
        description: "Force slot: morning or evening (blank = by clock)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: post-facebook
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/post_facebook.py
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          FORCE: ${{ github.event.inputs.force }}
          MODE: ${{ github.event.inputs.mode }}
      - name: Save post state
        if: github.event.inputs.dry_run != '1'
        run: |
          git config user.name "hermes-bot"
          git config user.email "hermes-bot@users.noreply.github.com"
          git add data/.fb_state.json
          if git diff --cached --quiet; then
            echo "no state change"
            exit 0
          fi
          git commit -m "[fb] record post state"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git pull --rebase --autostash origin main || exit 1
            sleep $((i * 3))
          done
          exit 1
